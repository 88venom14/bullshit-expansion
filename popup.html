<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hysteria Config Bot</title>
    <link rel="stylesheet" href="css/extension.css">
</head>

<body>
    <div class="notification" id="notification">✓ Переход выполнен</div>

    <div class="header">
        <div class="header-left">
            <div class="status-dot"></div>
            <h1>HYSTERIA CONFIG</h1>
        </div>
        <span class="version">v1.0.0</span>
    </div>

    <div class="content">
        <div class="icon-container">
            <img src="assets/kurumi.gif" alt="Hysteria Bot" class="icon">
        </div>

        <p class="title">Hysteria Configuration</p>

        <p class="description">
            Автоматическая генерация и настройка конфигурации Hysteria через Telegram бот
        </p>

        <div class="button-container">
            <button class="ad-button" id="adLink">
                Открыть бота
            </button>
        </div>

        <div class="divider"></div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value" id="clickCount">0</div>
                <div class="stat-label">Кликов</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="visitCount">0</div>
                <div class="stat-label">Посещений</div>
            </div>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">Статус</div>
                <div class="info-value active">Активен</div>
            </div>
            <div class="info-item">
                <div class="info-label">Платформа</div>
                <a href="https://t.me/hysteriyaconfig_bot" target="_blank" rel="noopener noreferrer"
                    class="info-value link">Telegram</a>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">Build 2026.03</div>
        <div class="footer-right">
            <a href="#" id="feedbackLink">Feedback →</a>
        </div>
    </div>

    <script src="js/popup.js"></script>
</body>

</html>
